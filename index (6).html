<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>يا مسافر</title>
<style>
:root{--bg:#0d1b2a;--card:#14263a;--line:#27425f;--ink:#eef4fa;--mute:#8fa6bd;--acc:#f2b705;--ok:#34c38f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
#app{position:relative;height:100%}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
button.pri{background:var(--acc);color:#241a00;border-color:var(--acc);font-weight:700}
button:disabled{opacity:.45}
select,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;width:100%}
/* لوحة القراءات */
#top{position:absolute;top:0;left:0;right:0;z-index:5;pointer-events:none;background:linear-gradient(#0d1b2aee,#0d1b2acc 70%,#0d1b2a00);padding-bottom:10px}#top>*{pointer-events:auto}#clk{display:flex;justify-content:space-between;align-items:center;padding:4px 10px 0;font-size:10px;color:var(--mute)}
#clk b{font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:1px}#mid{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:7px;line-height:1.1;white-space:nowrap}#yh{color:#FFC83D;font-family:"Brush Script MT","Segoe Script","Lucida Handwriting","Apple Chancery",cursive;font-style:italic;font-weight:400;font-size:10px;letter-spacing:.5px;animation:yhp 4s ease-in-out infinite}@keyframes yhp{0%,100%{opacity:0}50%{opacity:.9}}#clk span{line-height:1.5;text-align:left}
#tm{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 6px 3px}
#tm div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1px 3px;text-align:center;font-size:12px;line-height:1.25}
#tm small{display:block;color:var(--mute);font-size:9px}#tm .late{color:#ff8a65}
#hud{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:3px 6px}
#hud div{background:#14263acc;border:1px solid var(--line);border-radius:10px;padding:1px 3px;text-align:center}
#hud b{display:block;font-size:17px;line-height:20px;font-variant-numeric:tabular-nums}
#hud small{color:var(--mute);font-size:9px}
#hud .u{font-size:11px;color:var(--mute);font-weight:400}
/* الخريطة */
#mapw{position:absolute;inset:0;overflow:hidden;background:#1b3a5c}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none}#dots{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#attr{position:absolute;z-index:3;left:4px;bottom:62px;font-size:9px;color:#333;background:#ffffffaa;padding:0 4px;border-radius:3px;display:none}
#bTrip.on,#bPl.on,#bPts.on{background:#22b233 !important;color:#fff !important}#cmpBox{position:absolute;z-index:4;top:10px;right:10px;width:60px;height:60px;pointer-events:none}#cmpBox.off{display:none}#cmpS{transition:transform .2s linear;display:block;transform-origin:50% 50%}#mbtn{position:absolute;z-index:4;left:8px;top:auto;bottom:96px;transform:none;display:flex;flex-direction:column;gap:6px}
#qic{position:absolute;z-index:3;left:0;top:0;width:156px;display:none;flex-direction:column;align-items:center;direction:rtl;gap:3px;pointer-events:none}#qic.on{display:flex}.qt{background:#0d1b2a99;border:1px solid #ffffff44;border-radius:14px;height:64px;backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center}.qt:first-child{width:64px}.qi{flex-direction:column;width:156px;height:auto;font-size:10px;line-height:1.3;padding:4px 6px;text-align:center;color:#cfe0f0}.qcal{margin-top:3px;pointer-events:auto}.qcal button{font-size:10px;padding:2px 8px;border-radius:8px;margin:0 2px}.qi b{color:#fff;font-size:11px;display:block}
#qov{position:absolute;z-index:6;left:50%;bottom:74px;transform:translateX(-50%);display:none;text-align:center;pointer-events:none}#qov.on{display:block}#qtx{margin-top:4px;background:#0d1b2ae6;border:1px solid var(--line);border-radius:12px;padding:5px 12px;font-size:14px;display:inline-block}#apc{position:absolute;z-index:7;width:190px;background:#0d1b2af2;border:1px solid var(--acc);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--mute);display:none;line-height:1.5}#apc b{color:var(--ink);font-size:15px}#apc button{flex:1;padding:4px 6px;font-size:13px}
#mbtn button{width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;background:#0d1b2acc}#mbtn button.rb{border-radius:50%;background:#e8eaed;color:#1f1f1f;border:none;display:flex;align-items:center;justify-content:center}#mbtn button.rb.on{background:#22b233;color:#fff}
#near{margin:3px 6px 0;background:#0d1b2acc;border:1px solid var(--line);border-radius:10px;padding:3px 10px;font-size:12px}
#near b{color:var(--acc)}#nt{white-space:normal;line-height:1.5}#nbar{display:block;height:3px;border-radius:2px;background:#27425f;margin-top:3px;overflow:hidden}#nbar u{display:block;height:100%;width:0;background:#19e07a;transition:width .6s}
#prog{margin:0 6px 4px;background:#0d1b2acc;border:1px solid var(--line);border-radius:10px;padding:3px 10px;font-size:11px;color:var(--mute)}
#prog i{display:block;height:4px;border-radius:3px;background:#27425f;margin-top:3px;overflow:hidden}
#prog i u{display:block;height:100%;width:0;background:var(--ok);transition:width .6s}
/* الأسفل */
#bot{position:absolute;bottom:0;left:0;right:0;z-index:5;pointer-events:none;background:linear-gradient(#0d1b2a00,#0d1b2acc 35%,#0d1b2aee);padding-top:12px}#bot>*{pointer-events:auto}#bar{display:flex;gap:6px;padding:0 6px 6px}
#bar button{flex:1;padding:6px 4px;font-size:14px;background:#14263aee}#bar button svg{vertical-align:-4px;margin-inline-end:3px}#bar button.pri{background:var(--acc)}
.sr3{gap:4px;align-items:stretch}.sr3 input{flex:1.2;min-width:0;padding:8px 6px;font-size:13px}.sr3 button{flex:1;min-width:0;padding:8px 4px;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.sr3 .ph{color:var(--mute)}.sr3 input::placeholder{color:var(--mute)}.sror{align-self:center;color:var(--mute);font-size:12px}
.res{display:flex;flex-direction:column;gap:4px;margin-top:8px}.res button{text-align:right;display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;font-size:14px}.res small{color:var(--mute);font-size:11px;white-space:nowrap}
.pk{width:100%;text-align:right;padding:10px}
#sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:20}
#sheet.on{display:flex}#sheet.top{align-items:flex-start}#sheet.top #sc{border-radius:0 0 18px 18px;max-height:62%;border-top:0}
#sc{background:var(--bg);width:100%;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:14px;border-top:1px solid var(--line)}
#sc h3{margin:4px 0 10px;font-size:16px}
#sc label{display:block;color:var(--mute);font-size:12px;margin:6px 0 3px}#sc input{padding:6px 8px}
.row{display:flex;gap:8px}
.lst{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.lst div{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:14px}
.lst .past{opacity:.5}.lst .now{border-color:var(--acc)}
.hint{color:var(--mute);font-size:12px;margin-top:6px;line-height:1.7}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--acc);color:#241a00;padding:9px 16px;border-radius:20px;font-weight:700;z-index:30;display:none;max-width:90%;text-align:center}
#sc{max-height:72vh;overflow-y:auto;overflow-x:hidden}#sheet .row>*{min-width:0}#sheet .row input{min-width:0;width:100%;box-sizing:border-box}#tpb{display:flex;gap:6px;margin-top:5px}#tpb .sg{flex:1;height:4px;border-radius:3px;background:#27425f;overflow:hidden}#tpb .sg u{display:block;height:100%;width:0;background:#22b233;transition:width .3s}
</style>
</head>

function expShow(text,name){var o=document.getElementById('expBox');if(o)o.remove();o=document.createElement('div');o.id='expBox';o.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:14px';o.innerHTML='<div style="background:#fff;color:#111;border-radius:14px;padding:14px;max-width:440px;width:100%"><div style="font-weight:700;margin-bottom:6px">ملف الرحلة: '+name+'</div><div style="font-size:13px;margin-bottom:8px">إن لم ينزل الملف تلقائيًا، انسخ النص واحفظه في ملف بالاسم أعلاه بصيغة JSON.</div><textarea readonly style="width:100%;height:160px;font-size:12px;direction:ltr"></textarea><div style="display:flex;gap:8px;margin-top:8px"><button id="expCp" style="flex:1">نسخ النص</button><button id="expCl" style="flex:1">إغلاق</button></div></div>';document.body.appendChild(o);var ta=o.querySelector('textarea');ta.value=text;o.querySelector('#expCl').onclick=function(){o.remove();};o.querySelector('#expCp').onclick=function(){ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);var ok=false;try{ok=document.execCommand('copy');}catch(e){}if(!ok&&navigator.clipboard){navigator.clipboard.writeText(text).then(function(){toast('تم نسخ النص');},function(){toast('انسخ النص يدويًا');});return;}toast(ok?'تم نسخ النص':'انسخ النص يدويًا');};}
function expSaveTxt(txt,name){var done=false;function dl(){try{var a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(txt);a.download=name;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},1000);}catch(e){}}try{var f=null,ts=['application/json','text/plain'];for(var q=0;q<ts.length&&!f;q++){var c=new File([txt],name,{type:ts[q]});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[c]}))f=c;}if(f){done=true;navigator.share({files:[f],title:name}).catch(function(err){if(!err||err.name!=='AbortError')dl();});}}catch(e){}if(!done)dl();}
function expSave(blob,name){var fr=new FileReader();fr.onload=function(){var txt=fr.result;try{var a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(txt);a.download=name;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},1000);}catch(e){}expShow(txt,name);};fr.readAsText(blob);}

    else if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c!=='\r')f+=c;}

var R2D=180/Math.PI,D2R=Math.PI/180,EARTH=6371;
function AR(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d];});}
function hav(a,b,c,d){var p=(c-a)*D2R,q=(d-b)*D2R,x=Math.sin(p/2)*Math.sin(p/2)+Math.cos(a*D2R)*Math.cos(c*D2R)*Math.sin(q/2)*Math.sin(q/2);return 2*EARTH*Math.asin(Math.sqrt(x));}
function bearing(a,b,c,d){var y=Math.sin((d-b)*D2R)*Math.cos(c*D2R),x=Math.cos(a*D2R)*Math.sin(c*D2R)-Math.sin(a*D2R)*Math.cos(c*D2R)*Math.cos((d-b)*D2R);return (Math.atan2(y,x)*R2D+360)%360;}
function gcPoints(a,b,c,d,n){ // نقاط على الدائرة العظمى: الخط الذي تسلكه الطائرة غالبًا
  var f1=a*D2R,l1=b*D2R,f2=c*D2R,l2=d*D2R,dd=hav(a,b,c,d)/EARTH,out=[];
  if(dd<1e-9)return [[a,b]];
  for(var i=0;i<=n;i++){var t=i/n,A=Math.sin((1-t)*dd)/Math.sin(dd),B=Math.sin(t*dd)/Math.sin(dd),
    x=A*Math.cos(f1)*Math.cos(l1)+B*Math.cos(f2)*Math.cos(l2),y=A*Math.cos(f1)*Math.sin(l1)+B*Math.cos(f2)*Math.sin(l2),z=A*Math.sin(f1)+B*Math.sin(f2);
    out.push([Math.atan2(z,Math.sqrt(x*x+y*y))*R2D,Math.atan2(y,x)*R2D]);}
  return out;}
function wx(lon,z){return (lon+180)/360*Math.pow(2,z)*256;}
function wy(lat,z){var s=Math.sin(lat*D2R);return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*Math.pow(2,z)*256;}
function unx(px,z){return px/(Math.pow(2,z)*256)*360-180;}
function uny(py,z){var n=Math.PI-2*Math.PI*py/(Math.pow(2,z)*256);return Math.atan(Math.sinh(n))*R2D;}

function tileUrl(L,z,x,y){return LAYERS[L].url.replace('{z}',z).replace('{x}',x).replace('{y}',y);}

/* تحويل بلاطة الارتفاع إلى صورة تضاريس: ظلال + ألوان حسب الارتفاع */
function colorFor(e){ // أزرق للبحر ثم أخضر فبيج فبني فأبيض
  if(e<=0)return [24,70,118];
  var st=[[0,92,134,84],[300,150,160,96],[800,196,176,120],[1500,160,124,86],[2500,120,92,70],[3500,236,236,236]];
  for(var i=1;i<st.length;i++){if(e<=st[i][0]){var a=st[i-1],b=st[i],t=(e-a[0])/(b[0]-a[0]);return [a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t,a[3]+(b[3]-a[3])*t];}}
  return [236,236,236];}
function shadeTile(img){
  var c=document.createElement('canvas');c.width=c.height=256;var x=c.getContext('2d');x.drawImage(img,0,0,256,256);
  var d=x.getImageData(0,0,256,256),p=d.data,el=new Float32Array(65536),i,j;
  for(i=0;i<65536;i++)el[i]=p[i*4]*256+p[i*4+1]+p[i*4+2]/256-32768;
  for(j=0;j<256;j++)for(i=0;i<256;i++){
    var k=j*256+i,e=el[k],a=el[j*256+Math.min(255,i+1)]-el[j*256+Math.max(0,i-1)],b=el[Math.min(255,j+1)*256+i]-el[Math.max(0,j-1)*256+i],
        sh=e<=0?0:Math.max(-.6,Math.min(.6,(-a-b)*0.0045)),col=colorFor(e),f=1+sh;
    p[k*4]=Math.max(0,Math.min(255,col[0]*f));p[k*4+1]=Math.max(0,Math.min(255,col[1]*f));p[k*4+2]=Math.max(0,Math.min(255,col[2]*f));p[k*4+3]=255;}
  x.putImageData(d,0,0);c.el=el;return c;}
var IMG={},PENDING={},MISS={};
function getImg(L,z,x,y){
  var k=LAYERS[L].pre+z+'/'+x+'/'+y;if(IMG[k])return IMG[k];
  if(!PENDING[k]&&!(MISS[k]&&Date.now()-MISS[k]<4000)){PENDING[k]=1;
    dbGet(k).then(function(b){if(!b&&navigator.onLine&&z>=3&&z<=LAYERS[L].maxz){return fetch(tileUrl(L,z,x,y)).then(function(r){if(!r.ok)throw 0;return r.blob();}).then(function(bl){dbPut(k,bl);return bl;}).catch(function(){return null;});}return b;}).then(function(b){if(!b){MISS[k]=Date.now();PENDING[k]=0;return;}return createImageBitmap(b).then(function(im){IMG[k]=(L==='ter')?shadeTile(im):im;PENDING[k]=0;draw();});}).catch(function(){MISS[k]=Date.now();PENDING[k]=0;});}
  return null;}
function getAny(z,x,y){return getImg('ter',z,x,y);}

/* تحميل بلاطات الممر قبل الإقلاع (يحتاج إنترنت مرة واحدة) */
function corridorTiles(route,zmax,bufKm0){
  var set={},list=[];
  for(var z=4;z<=zmax;z++){
    var n=Math.pow(2,z),bufKm=z<=6?Math.max(bufKm0,450):bufKm0;   // مستويات التكبير الصغيرة تغطي مساحة أوسع حتى لا تبقى فراغات
    route.forEach(function(p){
      var dLat=bufKm/111,dLon=bufKm/(111*Math.max(.2,Math.cos(p[0]*D2R)));
      var x0=Math.floor(wx(p[1]-dLon,z)/256),x1=Math.floor(wx(p[1]+dLon,z)/256),y0=Math.floor(wy(Math.min(84,p[0]+dLat),z)/256),y1=Math.floor(wy(Math.max(-84,p[0]-dLat),z)/256);
      for(var X=x0;X<=x1;X++)for(var Y=y0;Y<=y1;Y++){var xx=((X%n)+n)%n,k=z+'/'+xx+'/'+Y;if(Y>=0&&Y<n&&!set[k]){set[k]=1;list.push([z,xx,Y]);}}
    });}
  return list;}
function downloadTiles(L,list,onp){
  var done=0,fail=0,i=0;
  return new Promise(function(ok){
    if(!list.length){ok({done:0,fail:0});return;}
    function fin(){if(done+fail>=list.length)ok({done:done,fail:fail});} // لا ينتهي إلا بعد اكتمال كل الصور
    function next(){
      if(i>=list.length)return;
      var it=list[i++],LL=it.L||L,t=it.t||it,k=LAYERS[LL].pre+t[0]+'/'+t[1]+'/'+t[2];
      dbGet(k).then(function(have){
        if(have){done++;onp(done+fail,list.length);fin();next();return;}
        fetch(tileUrl(LL,t[0],t[1],t[2])).then(function(r){if(!r.ok)throw 0;return r.blob();}).then(function(b){return dbPut(k,b);}).then(function(){done++;delete MISS[k];if(done%64===0)draw();},function(){fail++;}).then(function(){onp(done+fail,list.length);fin();next();});
      });}
    for(var w=0;w<8;w++)next(); // 8 طلبات متوازية
  });}

/* ======================= المسار والتقدّم ======================= */
function buildRoute(){
  var T=S.trip;if(!T){S.route=[];return;}
  S.route=gcPoints(T.a[2],T.a[3],T.b[2],T.b[3],240);S.alongKm=[0];
  for(var i=1;i<S.route.length;i++)S.alongKm.push(S.alongKm[i-1]+hav(S.route[i-1][0],S.route[i-1][1],S.route[i][0],S.route[i][1]));
  S.totalKm=S.alongKm[S.alongKm.length-1];
  // المناطق القريبة من المسار (حتى 70 كم) مرتبة على طول الخط
  S.near=[];
  ((T.pts||[]).map(function(p){return [p.n,p.lat,p.lon,1];})).forEach(function(pl){
    var best=1e9,bi=0;S.route.forEach(function(r,i){var d=hav(r[0],r[1],pl[1],pl[2]);if(d<best){best=d;bi=i;}});
    if(best<=70)S.near.push({n:pl[0],lat:pl[1],lon:pl[2],off:best,at:S.alongKm[bi],mine:!!pl[3]});});
  S.near.sort(function(a,b){return a.at-b.at;});
}
function progressKm(lat,lon){var best=1e9,bi=0;for(var i=0;i<S.route.length;i++){var d=hav(S.route[i][0],S.route[i][1],lat,lon);if(d<best){best=d;bi=i;}}return {km:S.alongKm[bi],off:best};}
function nearestPlace(lat,lon){
  var all=(((S.trip&&S.trip.pts)||[]).map(function(p){return [p.n,p.lat,p.lon];})),best=1e9,bp=null;
  all.forEach(function(p){var d=hav(lat,lon,p[1],p[2]);if(d<best){best=d;bp=p;}});return bp?{n:bp[0],d:best,lat:bp[1],lon:bp[2]}:null;}


/* ======================= أماكن الممر من الإنترنت (OpenStreetMap) ======================= */
/* الممر: CW كم يمين الطائرة و CW كم يسارها. الأماكن تُجلب من الإنترنت وتُحفظ، وتتحدّث كلما توفّر إنترنت */
var CW=20;
var OSMP=null;try{OSMP=JSON.parse(localStorage.getItem('fl.osm')||'null');}catch(e){}
function corrKey(){var T=S.trip;return T?(T.a[2]+','+T.a[3]+'>'+T.b[2]+','+T.b[3]):'';}
function matchRoute(lat,lon){ // أقرب نقطة على المسار، وجانب المكان: + يمين الاتجاه، - يسار
  var best=1e9,bi=0,R=S.route,n=R.length;
  for(var i=0;i<n;i++){var d=hav(R[i][0],R[i][1],lat,lon);if(d<best){best=d;bi=i;}}
  var j=Math.min(bi+1,n-1),k=j===bi?bi-1:bi;if(k<0)k=0;
  var hdg=bearing(R[k][0],R[k][1],R[j][0],R[j][1]),brg=bearing(R[bi][0],R[bi][1],lat,lon);
  var dt=((brg-hdg+540)%360)-180,off=best*Math.sin(dt*D2R);
  return {at:S.alongKm[bi],off:off,d:best};}
function fetchPlaces(force,cb){
  var T=S.trip;if(!T||!S.route.length){if(cb)cb('none');return;}
  if(!navigator.onLine){if(cb)cb('offline');return;}
  var k=corrKey();
  if(!force&&OSMP&&OSMP.key===k&&OSMP.cw===CW&&OSMP.v===3&&Date.now()-OSMP.at<7*864e5){if(cb)cb('cached');return;}
  var R=S.route,N=Math.max(1,Math.ceil(S.totalKm/300)),step=Math.max(1,Math.ceil(R.length/N)),parts=[];
  for(var i=0;i<R.length;i+=step)parts.push(R.slice(Math.max(0,i-2),Math.min(R.length,i+step+2)));
  var seen={},out=[],fails=0,idx=0;
  var filt=['["place"]','["tourism"]','["historic"]','["aeroway"="aerodrome"]','["natural"]','["waterway"="dam"]','["amenity"~"^(university|hospital|place_of_worship|school|fuel|marketplace)$"]','["railway"="station"]','["man_made"~"^(tower|lighthouse|works|water_tower)$"]','["landuse"~"^(farmland|village_green)$"]','["leisure"~"^(park|nature_reserve)$"]'];
  var take=function(j){(j.elements||[]).forEach(function(e){
      var t=e.tags||{},nm=t['name:ar']||t.name;if(!nm)return;
      var la=e.lat!=null?e.lat:(e.center&&e.center.lat),lo=e.lon!=null?e.lon:(e.center&&e.center.lon);if(la==null||lo==null)return;
      var m=matchRoute(la,lo);if(Math.abs(m.off)>CW)return;
      var key=nm+'|'+la.toFixed(3)+'|'+lo.toFixed(3);if(seen[key])return;seen[key]=1;
      out.push({n:nm,lat:la,lon:lo,at:m.at,off:m.off,kind:t.aeroway||t.place||t.tourism||t.historic||t.natural||t.waterway||t.amenity||t.railway||t.man_made||t.leisure||t.landuse||''});});};
  var finish=function(){
    window._ovFail=(fails===parts.length);
    if(fails===parts.length){if(cb)cb('fail');return;}
    OSMP={key:k,cw:CW,v:3,at:Date.now(),list:out};try{localStorage.setItem('fl.osm',JSON.stringify(OSMP));}catch(err){}
    if(cb)cb('ok',out.length);};
  var next=function(){
    if(idx>=parts.length){finish();return;}
    var seg=parts[idx++],la=seg.map(function(r){return r[0];}),lo=seg.map(function(r){return r[1];});
    var bb='('+(Math.min.apply(null,la)-.3).toFixed(3)+','+(Math.min.apply(null,lo)-.3).toFixed(3)+','+(Math.max.apply(null,la)+.3).toFixed(3)+','+(Math.max.apply(null,lo)+.3).toFixed(3)+')';
    var q='[out:json][timeout:40];('+filt.map(function(f){return 'nwr["name"]'+f+bb+';';}).join('')+');out center tags;';
    var ac=new AbortController(),tm=setTimeout(function(){ac.abort();},45000);
    var EPS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
    var tryEp=function(e){return fetch(EPS[e]+'?data='+encodeURIComponent(q),{signal:ac.signal}).then(function(r){if(!r.ok)throw 0;return r.json();}).catch(function(err){if(e+1<EPS.length&&!ac.signal.aborted)return tryEp(e+1);throw err;});};
    tryEp(0).then(function(j){take(j);},function(){fails++;}).then(function(){clearTimeout(tm);next();});};

function corrList(){ // أسماء الممر للرسم على الخريطة
  return (OSMP&&OSMP.key===corrKey()&&OSMP.cw===CW&&OSMP.list)?OSMP.list.map(function(p){return [p.n,p.lat,p.lon,0];}):[];}
function corrText(lat,lon){ // «بجوار» المدن والمعالم القريبة من الممر (ضمن CW كم يمينًا ويسارًا، و60 كم أمامًا وخلفًا)
  if(!S.route.length)return '';
  var pr=progressKm(lat,lon),cand=[],seen={};
  var add=function(n,la,lo,kind){if(!n||seen[n]||la==null||lo==null)return;var m=matchRoute(la,lo);if(Math.abs(m.off)>CW||Math.abs(m.at-pr.km)>60)return;var past=m.at<pr.km-5;if(past&&!(kind==='pt'&&m.at>=pr.km-30))return;seen[n]=1;cand.push({n:n,at:m.at,off:m.off,kind:kind||'',past:past});};
  PLACES.forEach(function(p){add(p[0],p[1],p[2],'city');});
  ((S.trip&&S.trip.pts)||[]).forEach(function(p){add(p.n,p.lat,p.lon,'pt');});
  if(OSMP&&OSMP.key===corrKey()&&OSMP.cw===CW&&OSMP.list)OSMP.list.forEach(function(p){add(p.n,p.lat,p.lon,p.kind);});
  if(!cand.length)return '';
  cand.sort(function(x,y){return Math.abs(x.at-pr.km)-Math.abs(y.at-pr.km);});
  return cand.slice(0,6).map(function(p){var o=Math.abs(p.off);if(p.past)return 'مررت بـ '+p.n;
    if(o<=1.5)return (p.kind==='aerodrome'&&!/^مطار/.test(p.n)?'فوق مطار ':'فوق ')+p.n;
    return 'بجوار '+p.n+' · '+AR(Math.round(o))+' كم '+(p.off>0?'يمين':'يسار')+' الطائرة';}).join('<br>');}
function updateAll(force){ // تحديث من الإنترنت: أماكن الممر + بلاطات الخريطة، والأزرار معطّلة حتى الانتهاء
  if(!navigator.onLine){toast('لا يوجد إنترنت الآن، سيُحدَّث لاحقًا');return;}
  if(!S.route.length){toast('احفظ الرحلة أولًا');return;}
  if(window._upd)return;window._upd=true;try{localStorage.setItem('fl.upd','1');}catch(e){}
  var fm=$('fm'),segs=document.querySelectorAll('#tpb u'),btns=['fs','fsim','fnow','fsv'].map(function(i){return $(i);}).filter(function(x){return x;});
  btns.forEach(function(b){b.disabled=true;});
  var PARTS=4,msgs=[],left=1,fail=0,bad=false,doneAll=0,flat=[];
  var layers=MAPMODE==='sat'?['sat','ter']:['ter'];
  layers.forEach(function(L){corridorTiles(S.route,L==='sat'?12:9,70).forEach(function(t){flat.push({L:L,t:t});});});
  var total=flat.length,chunks=[],start=[];
  for(var p=0;p<PARTS;p++){var x=Math.floor(total*p/PARTS),y=Math.floor(total*(p+1)/PARTS);chunks.push(flat.slice(x,y));start.push(x);}
  segs.forEach(function(u){u.style.width='0';});
  var show=function(){
    var part=PARTS;
    chunks.forEach(function(c,p){var f=c.length?Math.max(0,Math.min(1,(doneAll-start[p])/c.length)):1;if(segs[p])segs[p].style.width=(f*100)+'%';
      if(c.length&&doneAll>=start[p]&&doneAll<start[p]+c.length&&part===PARTS)part=p+1;});
    var pct=total?Math.floor(doneAll*100/total):100;
    if(fm){fm.style.color='#22b233';fm.textContent='الجزء '+AR(part)+' من '+AR(PARTS)+' · '+AR(doneAll)+' من '+AR(total)+' صورة ('+AR(pct)+'%)';}};
  var end=function(m,isBad){if(isBad)bad=true;msgs.push(m);if(--left>0)return;window._upd=false;setTimeout(draw,0);btns.forEach(function(b){b.disabled=false;});
    if(fm){fm.style.color='#22b233';fm.textContent=(bad?'⚠ لم يكتمل التحميل · ':'✓ تم التحميل نهائيًا · ')+msgs.join(' · ');}};

  var runPart=function(p){
    if(p>=PARTS){if(!fail){try{localStorage.removeItem('fl.upd');}catch(e){}}end(fail?('الخريطة: تعذّر '+AR(fail)+' صورة، اضغط تحديث مرة ثانية'):'الخريطة كاملة للعمل بدون إنترنت',fail>0);return;}
    var c=chunks[p];if(!c.length){runPart(p+1);return;}
    var before=doneAll;show();
    downloadTiles(null,c,function(d){doneAll=before+d;show();}).then(function(res){fail+=res.fail;doneAll=before+c.length;show();setTimeout(function(){runPart(p+1);},350);});};
  if(!total){end('الخريطة محفوظة',false);return;}
  runPart(0);}

['bgps','bfly','bloc','mtype'].forEach(function(id){var e=$(id);if(e)e.addEventListener('click',function(){S.routeOn=false;markBar(null);draw();});});
function devApply(){var g=$('bgps'),f=$('bfly');if(!g||!f)return;g.classList.toggle('on',DEV.gps);f.classList.toggle('on',DEV.air);}
function devRead(){if(!(window.Android&&Android.getState))return;try{var st=JSON.parse(Android.getState());DEV={gps:!!st.gps,air:!!st.air,ok:true};devApply();}catch(e){}}
window.onDevState=function(st){DEV={gps:!!st.gps,air:!!st.air,ok:true};devApply();};
$('bgps').onclick=function(){
  if(DEV.gps){toast('الجي بي اس مفعّل ✓');return;}
  toast('تأكد من تشغيل الجي بي اس');
  if(window.Android&&Android.openGps)Android.openGps();};
$('bfly').onclick=function(){
  if(DEV.air){toast('وضع الطيران مفعّل ✓');return;}
  toast('تأكد من تفعيل وضع الطيران');
  if(window.Android&&Android.openAir)Android.openAir();};
setInterval(devRead,2000);devRead();

/* ======================= النوافذ ======================= */
function sheet(h,top){$('sc').innerHTML=h;$('sheet').classList.toggle('top',!!top);$('sheet').classList.add('on');}
$('sheet').addEventListener('click',function(e){if(e.target===$('sheet'))$('sheet').classList.remove('on');});
function airOptsOld(sel){return AIRPORTS.map(function(a,i){return '<option value="'+i+'"'+(sel===a[0]?' selected':'')+'>'+a[1]+' ('+a[0]+')</option>';}).join('');}
function schedMs(){var T=S.trip;if(!T||!T.depDate||!T.dep)return null;var d=new Date(T.depDate+'T'+T.dep+':00');return isNaN(d)?null:d.getTime();}
function schedTxt(){var T=S.trip,d=new Date(T.depDate+'T'+T.dep+':00');return d.toLocaleDateString('ar-SA',{weekday:'long',day:'numeric',month:'long'})+' الساعة '+T.dep;}
function shortAp(a){return a?(a[0]+' · '+String(a[1]).split(' – ')[0].split(' (')[0].slice(0,16)):'';}
$('bTrip').onclick=function(){var T=S.trip;if(T){var f=function(c){return allAir().filter(function(x){return x[0]===c[0];})[0]||c;};if(!S.draft.a)S.draft.a=f(T.a);if(!S.draft.b)S.draft.b=f(T.b);}var DA=S.draft.a,DB=S.draft.b;
  sheet('<div class="row"><input id="fn" placeholder="رقم الرحلة (اختياري)" value="'+((T&&T.fn)||'')+'" style="flex:1;direction:ltr;text-align:left"></div>'
   +'<div class="row" style="margin-top:8px"><button class="pk" id="fa" style="flex:1"><small class="hint">من</small><br>'+(DA?shortAp(DA):'اختر…')+'</button><button class="pk" id="fb" style="flex:1"><small class="hint">إلى</small><br>'+(DB?shortAp(DB):'اختر…')+'</button></div>'
   +'<div class="row" style="margin-top:8px"><div style="flex:1"><small class="hint">تاريخ الإقلاع</small><input type="date" id="tdd" value="'+((T&&T.depDate)||'')+'"></div><div style="flex:1"><small class="hint">الإقلاع</small><input type="time" id="td" value="'+((T&&T.dep)||'')+'"></div><div style="flex:1"><small class="hint">الوصول</small><input type="time" id="ta" value="'+((T&&T.arr)||'')+'"></div></div>'
   +'<div class="row" style="margin-top:10px"><button class="pri" id="fs" style="flex:1">تحديث وحفظ المسار</button><button id="fsim">افتراضي</button><button id="fnow">أقلعت الآن</button></div>'
   +'<div class="hint" id="fm" style="margin-top:6px">اختر المطارين والتاريخ والأوقات ثم اضغط تحديث وحفظ المسار.</div><div id="tpb"><div class="sg"><u></u></div><div class="sg"><u></u></div><div class="sg"><u></u></div><div class="sg"><u></u></div></div><div class="row" style="margin-top:8px"><button id="tBack" style="flex:1;font-size:12px">رجوع</button><button id="fsv" style="flex:2">الرحلات المحفوظة</button></div>');
  $('fa').onclick=function(){pickerOpen('a');};$('fb').onclick=function(){pickerOpen('b');};
  $('fs').onclick=function(){var A=DA,B=DB;if(!A||!B){$('fm').textContent='اختر مطار الإقلاع ومطار الوصول.';return;}if(A[0]===B[0]){$('fm').textContent='اختر مطارين مختلفين.';return;}
    var same=T&&T.a[0]===A[0]&&T.b[0]===B[0];if(!same){S.trail=[];try{localStorage.removeItem('fl.trail');}catch(e){}}
    S.trip={a:A,b:B,pts:same?T.pts:[],depDate:$('tdd').value,dep:$('td').value,arr:$('ta').value,dl:same?(T.dl||0):0,act:same?T.act:null,fn:$('fn').value.trim()};
    saveTrip();S.passed={};buildRoute();fitRoute();draw();toast('✓ حُفظت الرحلة');updateAll(true);};
  $('fsv').onclick=savedSheet;
  $('tBack').onclick=function(){$('sheet').classList.remove('on');};
  $('fnow').onclick=function(){if(!S.trip){$('fm').textContent='احفظ الرحلة أولًا.';return;}
    var st=schedMs();if(st==null){$('fm').textContent='أدخل تاريخ الإقلاع ووقته أولًا ثم احفظ.';return;}
    if(Date.now()<st){$('fm').textContent='لم يحن الوقت. الإقلاع المحدد: '+schedTxt()+'. عدّل التاريخ أو الوقت في الأعلى ثم احفظ.';return;}
    S.trip.act=Date.now();saveTrip();showTimes();$('fm').textContent='سُجّل الإقلاع '+hm(S.trip.act);};
  $('fsim').onclick=function(){if(!S.trip){$('fm').textContent='احفظ الرحلة أولًا.';return;}$('sheet').classList.remove('on');startSim(true);};
};

$('mtype').onclick=function(){sheet('<h3>نوع الخريطة</h3><div class="row" style="margin-top:8px"><button id="mt0" class="'+(MAPMODE==='auto'?'pri':'')+'" style="flex:1">تلقائي</button><button id="mt1" class="'+(MAPMODE==='ter'?'pri':'')+'" style="flex:1">تضاريس</button><button id="mt2" class="'+(MAPMODE==='sat'?'pri':'')+'" style="flex:1">قمر صناعي</button></div>');
  var set=function(m){MAPMODE=m;try{localStorage.setItem('fl.map',m);}catch(e){}$('sheet').classList.remove('on');draw();};
  $('mt0').onclick=function(){set('auto');};$('mt1').onclick=function(){set('ter');};$('mt2').onclick=function(){set('sat');};};
$('bPts').onclick=function(){if(MAPMODE!=='auto'){MAPMODE='auto';try{localStorage.setItem('fl.map','auto');}catch(e){}}$('sheet').classList.remove('on');draw();toast('اضغط مطولًا على الموقع الذي تريده، واكتب اسم النقطة');};
$('bPl').onclick=function(){if(!S.route.length){sheet('<h3>🧭 نقاط المسار</h3><div class="hint">اختر الرحلة أولًا.</div>');return;}
  var km=S.pos?progressKm(S.pos.lat,S.pos.lon).km:0,P=(S.trip&&S.trip.pts)||[];
  var all=S.near.filter(function(p){return p.mine;}).sort(function(x,y){return x.at-y.at;});
  sheet('<h3>🧭 نقاط المسار ('+AR(all.length)+')</h3><button class="pri" id="pAdd">احفظ موقعي الحالي كنقطة</button><div class="hint">أو اضغط مطولًا على أي مكان في الخريطة.</div><div class="lst">'
   +(all.length?all.map(function(p){var idx=P.findIndex(function(q){return q.n===p.n;});var passed=p.at<km-5,m=matchRoute(p.lat,p.lon);
     return '<div class="'+(passed?'past':'')+'"><span>'+p.n+'</span><span>'+(passed?'مررت':'بعد '+AR(Math.round(p.at-km))+' كم')+' · '+(Math.abs(m.off)<1.5?'على الخط':AR(Math.round(Math.abs(m.off)))+' كم '+(m.off>0?'يمين':'يسار'))+'</span><button data-pd="'+idx+'">حذف</button></div>';}).join(''):'<div><span>لا توجد نقاط بعد</span></div>')+'</div>');
  $('pAdd').onclick=function(){if(!S.pos){toast('لم يُحدَّد موقعك بعد');return;}$('sheet').classList.remove('on');savePoint(S.pos.lat,S.pos.lon);};
  $('sc').querySelectorAll('[data-pd]').forEach(function(btn){btn.onclick=function(){var i=+btn.dataset.pd;if(i>=0){S.trip.pts.splice(i,1);saveTrip();buildRoute();draw();}$('bPl').onclick();};});};
$('bGo').onclick=function(){if(S.watch!=null){navigator.geolocation.clearWatch(S.watch);S.watch=null;S.waiting=false;S.pos=null;window._armed=false;stopAll();draw();toast('أُوقف التتبع');return;}if(S.sim){pauseSim();return;}if(S.simMode){startSim(false);return;}if(!S.trip){$('bTrip').onclick();return;}
  if(!S.trip.act){var st=schedMs();
    if(st==null){toast('أدخل تاريخ الإقلاع ووقته أولًا، ثم احفظ');return;}
    if(Date.now()<st){window._armed=true;$('nt').textContent='التتبع يبدأ عند الإقلاع: '+schedTxt();toast('الرحلة لم تبدأ بعد. التتبع يبدأ تلقائيًا عند '+schedTxt());return;}}
  window._armed=false;startGps();};
/* بدء تلقائي عند حلول وقت الإقلاع إذا ضغطت «ابدأ» قبله */
setInterval(function(){if(!window._armed||!S.trip||S.trip.act||S.watch!=null||S.sim)return;var st=schedMs();if(st!=null&&Date.now()>=st){window._armed=false;startGps();}},20000);
function fitRoute(){if(!S.route.length)return;var pts=S.route.concat(S.trail);if(S.pos)pts=pts.concat([[S.pos.lat,S.pos.lon]]);
  var la=pts.map(function(r){return r[0];}),lo=pts.map(function(r){return r[1];}),
  c=[(Math.min.apply(0,la)+Math.max.apply(0,la))/2,(Math.min.apply(0,lo)+Math.max.apply(0,lo))/2],span=Math.max(Math.max.apply(0,la)-Math.min.apply(0,la),(Math.max.apply(0,lo)-Math.min.apply(0,lo))*Math.cos(c[0]*D2R)),
  W=cv.clientWidth||340;S.view={lat:c[0],lon:c[1],z:Math.max(3,Math.min(8,Math.log2((W/256)*360/(Math.max(.5,span)*1.5))))};}
function clock(){var d=new Date();$('cT').textContent=AR(('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2));}
try{var HF=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),GF=new Intl.DateTimeFormat('ar',{day:'numeric',month:'long',year:'numeric'});
  $('cH').textContent=HF.format(new Date());$('cG').textContent=GF.format(new Date());}catch(e){}
setInterval(clock,1000);clock();showTimes();
setTimeout(function(){if(S.trip&&!S.route.length)buildRoute();},3000);
window.addEventListener('resize',function(){fit();draw();});
function resumeUpd(){try{if(localStorage.getItem('fl.upd')==='1'&&S.trip&&!window._upd&&navigator.onLine)setTimeout(function(){updateAll(false);},1500);}catch(e){}}
document.addEventListener('visibilitychange',function(){if(!document.hidden)resumeUpd();});
setTimeout(resumeUpd,4000);
fit();buildRoute();fitRoute();draw();loadWorld(false);
</script>
</body>
</html>
